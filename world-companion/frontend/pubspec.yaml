name: world_companion
description: World Companion — Phase 1 (Voice Navigation + Route Optimization)
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_markdown_plus: ^1.0.0+1
  maplibre_gl: ^0.22.0
  geolocator: ^13.0.3
  speech_to_text: ^7.0.0

  # Google authentication
  google_sign_in: ^6.2.2
  google_identity_services_web: ^0.3.3+1
  web: ^1.1.1
  google_fonts: ^6.3.0

  # Future / optional packages
  # record: ^5.1.0
  # permission_handler: ^11.3.0
  # google_maps_flutter: ^2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
